groups:
  - name: basic-alerts
    rules:

      - alert: AppDown
        expr: up{job="flask_app"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Flask app is down"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[1m]) > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "High error rate"